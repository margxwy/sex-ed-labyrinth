    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const rows = document.querySelectorAll('.author-row');
            const items = [];

            rows.forEach(row => {
                const speed = parseFloat(row.dataset.speed) || 1.8;
                const cards = Array.from(row.querySelectorAll('.author-card'));

                cards.forEach(card => {
                    const state = {
                        el: card,
                        row,
                        speed,
                        paused: false,
                        startRatio: parseFloat(card.dataset.start) || 0,
                        x: 0
                    };

                    card.addEventListener('mouseenter', () => { state.paused = true; });
                    card.addEventListener('mouseleave', () => { state.paused = false; });
                    card.addEventListener('touchstart', () => { state.paused = !state.paused; }, { passive: true });

                    items.push(state);
                });
            });

            function initPositions() {
                items.forEach(item => {
                    const rowW = item.row.offsetWidth || window.innerWidth;
                    const cardW = item.el.offsetWidth || 220;
                    const span = rowW + cardW + 80;
                    item.x = item.startRatio * span - cardW * 0.2;
                    item.el.style.transform = `translate3d(${item.x}px, -50%, 0)`;
                });
            }

            initPositions();
            window.addEventListener('resize', initPositions);

            let lastTime = performance.now();
            function tick(now) {
                const dt = Math.min(40, now - lastTime) / 16.67;
                lastTime = now;

                items.forEach(item => {
                    if (!item.paused) {
                        const rowW = item.row.offsetWidth || window.innerWidth;
                        const cardW = item.el.offsetWidth || 220;
                        item.x -= item.speed * dt;

                        if (item.x < -cardW - 30) {
                            item.x = rowW + 30;
                        }
                        item.el.style.transform = `translate3d(${item.x}px, -50%, 0)`;
                    }
                });

                requestAnimationFrame(tick);
            }

            requestAnimationFrame(tick);
        });
    </script>
